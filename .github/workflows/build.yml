
name: Build Aseprite Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Aseprite source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Download Skia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\deps\skia
          Invoke-WebRequest `
            -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" `
            -OutFile C:\deps\skia.zip
          Expand-Archive C:\deps\skia.zip C:\deps\skia -Force

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR=C:\deps\skia `
            -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 `
            -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib

      - name: Compile Aseprite
        run: cmake --build build --target aseprite --parallel 2

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: build/bin/
          if-no-files-found: error
